name: README table of contents

on:
  push:
    branches: ['**']
    paths:
      - 'README.md'
      - 'README.ru.md'
      - 'scripts/update_readme_toc.py'
      - 'tests/test_readme_toc.py'
      - '.github/workflows/readme-toc.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'README.ru.md'
      - 'scripts/update_readme_toc.py'
      - 'tests/test_readme_toc.py'
      - '.github/workflows/readme-toc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-toc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test generator
        run: python -m unittest discover -s tests -p test_readme_toc.py -v
      - name: Check README table of contents
        run: python scripts/update_readme_toc.py --check

  update:
    if: >-
      github.ref_type == 'branch' &&
      (github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test generator
        run: python -m unittest discover -s tests -p test_readme_toc.py -v
      - name: Generate README table of contents
        run: python scripts/update_readme_toc.py
      - name: Commit changes when needed
        run: |
          if git diff --quiet -- README.md README.ru.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md README.ru.md
          git commit -m 'docs: update README table of contents'
          git push
