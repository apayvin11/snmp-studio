name: Test source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libopengl0 libgl1
      - run: python -m pip install -r requirements.txt
      - run: python scripts/update_readme_toc.py --check
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
