name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            arch: arm64
            format: dmg
            artifact: SNMPStudio-1.0.0-macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            arch: x86_64
            format: dmg
            artifact: SNMPStudio-1.0.0-macos-x86_64
          - name: Ubuntu AMD64
            runner: ubuntu-24.04
            arch: x86_64
            format: deb
            artifact: snmpstudio_1.0.0_amd64
          - name: Ubuntu ARM64
            runner: ubuntu-24.04-arm
            arch: arm64
            format: deb
            artifact: snmpstudio_1.0.0_arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-release.txt
      - name: Linux GUI and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libegl1 libopengl0 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-render-util0 desktop-file-utils
      - name: Install build dependencies
        run: python -m pip install -r requirements-release.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build installer
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/package.py --format ${{ matrix.format }} --arch ${{ matrix.arch }}
      - name: Validate and smoke test Linux package
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate packaging/snmpstudio.desktop
          sudo apt-get install -y ./release/*.deb
          QT_QPA_PLATFORM=xcb xvfb-run -a /usr/bin/snmpstudio --demo --screenshot build/installed-linux.png --quit-after 3
          test -s build/installed-linux.png
          test -f /usr/share/applications/snmpstudio.desktop
          sudo apt-get remove -y snmpstudio
      - name: Smoke test macOS app
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "dist/SNMP Studio.app/Contents/MacOS/SNMPStudio" --demo --screenshot build/bundled-macos.png --quit-after 3
          test -s build/bundled-macos.png
          codesign --verify --deep --strict "dist/SNMP Studio.app"
      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.deb
            release/*.sha256
          if-no-files-found: error
          retention-days: 30
